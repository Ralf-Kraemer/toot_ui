name: toot_ui
description: Fork of tweet_ui. Show toots from a Mastodon API JSON on Android and iOS. Support for toots with 1-4 photos, Video, GIFs, hashtags, mentions, symbols, urls, quoted toots and retoots.
version: 4.0.6
homepage: https://github.com/schibsted/tweet_ui
publish_to: 'none' 

environment:
  sdk: ">=2.15.0 <3.0.0"
  flutter: ">=2.8.1"

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  collection: ^1.15.0
  intl: ^0.20.0
  photo_view: ^0.14.0
  url_launcher: ^6.0.20
  html_unescape: ^2.0.0
  json_annotation: ^4.4.0
  golden_toolkit: ^0.13.0
  carousel_slider: ^5.0.0
  share_plus: ^11.0.0
  shared_preferences: ^2.5.4
  mastodon_api:
    git:
      url: https://github.com/Ralf-Kraemer/mastodon_api.git
dev_dependencies:
  build_runner: ^2.1.8
  json_serializable: ^6.1.5
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  fonts:
    - family: Roboto

      fonts:
        - asset: fonts/Roboto-Thin.ttf
          weight: 100
        - asset: fonts/Roboto-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: fonts/Roboto-Light.ttf
          weight: 200
        - asset: fonts/Roboto-LightItalic.ttf
          weight: 200
          style: italic
        - asset: fonts/Roboto-Regular.ttf
          weight: 400
        - asset: fonts/Roboto-RegularItalic.ttf
          weight: 400
          style: italic
        - asset: fonts/Roboto-Medium.ttf
          weight: 500
        - asset: fonts/Roboto-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: fonts/Roboto-Bold.ttf
          weight: 700
        - asset: fonts/Roboto-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: fonts/Roboto-Black.ttf
          weight: 900
        - asset: fonts/Roboto-BlackItalic.ttf
          weight: 900
          style: italic
